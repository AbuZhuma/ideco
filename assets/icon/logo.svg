<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A5B"/>
      <stop offset="1" stop-color="#14A38B"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF3EE"/>
    </linearGradient>
  </defs>
  <!-- фон -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- мягкий блик -->
  <circle cx="300" cy="260" r="330" fill="#FFFFFF" fill-opacity="0.07"/>

  <!-- капсула микрофона в виде страницы блокнота -->
  <rect x="352" y="172" width="320" height="480" rx="160" fill="url(#capsule)"/>
  <!-- строки текста -->
  <rect x="432" y="330" width="160" height="30" rx="15" fill="#1B2A5B"/>
  <rect x="432" y="400" width="160" height="30" rx="15" fill="#1B2A5B"/>
  <rect x="432" y="470" width="104" height="30" rx="15" fill="#14A38B"/>

  <!-- дуга-держатель -->
  <path d="M292 500 a220 220 0 0 0 440 0" fill="none" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round"/>
  <!-- ножка и подставка -->
  <rect x="485" y="716" width="54" height="90" rx="27" fill="#FFFFFF"/>
  <rect x="380" y="800" width="264" height="54" rx="27" fill="#FFFFFF"/>

  <!-- звуковые волны, акцент -->
  <path d="M748 392 a126 126 0 0 1 0 196" fill="none" stroke="#FFC857" stroke-width="42" stroke-linecap="round"/>
  <path d="M812 334 a208 208 0 0 1 0 312" fill="none" stroke="#FFC857" stroke-width="42" stroke-linecap="round" stroke-opacity="0.65"/>
</svg>
